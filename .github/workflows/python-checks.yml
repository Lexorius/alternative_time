name: Python checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    env:
      DOMAIN: alternative_time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff pyyaml pytest aiohttp

      - name: Compile-check
        run: python -m compileall -q custom_components/

      - name: Manifest-Check
        run: bash scripts/check-manifest.sh

      - name: Ruff
        # E501 (line-too-long) wird bewusst ignoriert: das Plugin enthält
        # mehrsprachige Beschreibungs-Strings in 12 Sprachen, die nicht
        # sinnvoll umgebrochen werden können.
        run: ruff check custom_components/ tests/ tests_ha/ --select E,F,W,I --ignore E501

      - name: Tests
        # tests/ läuft ohne Home-Assistant-Installation (HA wird in
        # tests/conftest.py gestubbt): Discovery, Scheduler/Fehlerpfade,
        # UT1-Backoff, Recorder-Churn, Übersetzungen (inkl. hassfest-HTML-Regel).
        run: python -m pytest tests -q -p no:cacheprovider

      - name: JSON lint
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ok = True
          for f in Path(".").rglob("*.json"):
              if ".git" in f.parts:
                  continue
              try:
                  json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"FAIL {f}: {e}"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: YAML lint
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          ok = True
          for f in list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml")):
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"FAIL {f}: {e}"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Version-Konsistenz
        run: |
          V=$(python -c "import json; print(json.load(open('custom_components/${DOMAIN}/manifest.json'))['version'])")
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md fehlt – überspringe Version-Konsistenz-Check"
            exit 0
          fi
          if ! grep -q "\[$V\]" CHANGELOG.md; then
            echo "::error::Version $V fehlt im CHANGELOG.md"; exit 1
          fi
          echo "✓ Version $V im CHANGELOG"

  home-assistant:
    name: Tests gegen Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Bringt einen echten Home-Assistant-Kern mit (keine Stubs).
      - run: pip install pytest-homeassistant-custom-component LunarCalendar

      - name: Tests in einem echten Home-Assistant-Kern
        # tests_ha/ richtet die Integration in Home Assistant ein und prüft
        # Entity-IDs, Einrichtungs-Assistent, Options-Dialog und ID-Migration.
        # Getrennt von tests/, dessen conftest homeassistant durch Stubs ersetzt.
        run: python -m pytest tests_ha -q -p no:cacheprovider
